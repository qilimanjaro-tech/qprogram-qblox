name: Bug Report
description: Report a bug or unexpected behavior in qprogram-qblox
title: "[Bug]: "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. A one-line title like `qblox.<operation> ignores its <argument>` plus a snippet that fails is enough.

        If the problem reproduces without importing `qprogram_qblox`, it belongs in [qprogram](https://github.com/qilimanjaro-tech/qprogram/issues) instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is broken, in a sentence or two. Add the cause or a suggested fix if you know it.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: minimal_example
    attributes:
      label: Minimal Reproducible Example
      description: The shortest program that shows the problem.
      placeholder: |
        import qprogram as qp
        import qprogram_qblox

        # Your minimal example here
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Paste the output, error message or traceback. No need to describe it in words.
      render: shell
    validations:
      required: true

  - type: textarea
    id: qp_file
    attributes:
      label: ".qp Text"
      description: |
        For a serialization, parsing or validation bug, paste the `.qp` text, either `print(qp.dumps(program))` or the file itself if it came from disk. Include the `require qblox` line.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: System Information
      description: |
        Output of:

        ```python
        import platform, sys, qprogram as qp, qprogram_qblox

        print("qprogram-qblox", qprogram_qblox.__version__)
        print("qprogram      ", qp.__version__)
        print("python        ", sys.version.split()[0], "|", platform.platform())
        ```

        If you are a maintainer on a dev checkout, the two versions and the OS are enough.
      render: shell
    validations:
      required: true
